# Keep the build light; CI machines and dev boxes vary.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.nonTransitiveRClass=true
# The WireGuard tunnel library (06c79dc6c3) pulls AndroidX
# dependencies; without this flag AGP refuses the build at
# checkDebugAarMetadata. Companion to the TUNNEL dependency pin.
android.useAndroidX=true
