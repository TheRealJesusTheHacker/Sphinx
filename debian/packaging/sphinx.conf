# Sphinx — daemon settings.
#
# Every line is optional; anything you leave out (or comment out)
# uses the standard setting. Changes take effect when the service
# restarts:  sudo systemctl restart sphinx

# The upstream resolver Sphinx forwards the questions it lets
# through to, and the fallback it tries once if the first does not
# answer. These are the shared filtering spec's standard resolvers.
# After them, the chain's floor is automatic: the machine's own
# DNS servers, read from the settings saved when Sphinx was
# turned on, so a network that cannot reach the public resolvers
# still answers allowed questions through its own resolver.
# An upstream on this machine itself is refused — Sphinx never
# forwards into a local resolver; that would loop questions back.
# upstream = 1.1.1.1
# fallback = 9.9.9.9

# The query log: recent names the filter was asked about, held only
# in the service's memory — never written to disk, never sent
# anywhere, gone when the service stops. Set to off to stop
# recording entirely.
# query_log = on
