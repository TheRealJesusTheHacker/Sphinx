name: Sphinx — Android (Personal APK)

# Personal-use build for the owner only.
#
# Manual dispatch only. This builds the AGP debug variant, which is
# signed with the standard Android debug key. That makes it installable
# on the owner's own phone with no keystore step, but it is NOT a
# release build: never attach this APK to a GitHub release and never
# describe it as shipped. The signed-release path stays in
# sphinx-android.yml and remains fail-closed without the owner's
# keystore secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Run the Android unit tests (Gradle)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the personal debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sphinx-android-personal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
