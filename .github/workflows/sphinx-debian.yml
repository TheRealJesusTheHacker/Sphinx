name: Sphinx — Debian edition

# The Debian edition's build gate: the pytest suite (core parity
# with the other editions, forwarding discipline, the engage/restore
# guard proven on fakes) plus a real .deb build whose payload is
# verified file by file. The dev VM and CI both build the package
# with dpkg-deb — no Windows-style cross-build gap here.
on:
  push:
    paths:
      - "debian/**"
      - "app/src/main/assets/bundled-blocklist.txt"
      - ".github/workflows/sphinx-debian.yml"
  pull_request:
    paths:
      - "debian/**"
      - "app/src/main/assets/bundled-blocklist.txt"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debian
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Shellcheck the maintainer scripts
        run: >-
          shellcheck -s sh packaging/postinst packaging/prerm
          packaging/postrm packaging/build-deb.sh packaging/sphinx

      - name: Build the .deb
        run: sh packaging/build-deb.sh dist

      - name: Verify the package payload
        run: |
          dpkg-deb -I dist/sphinx_*.deb
          dpkg-deb -c dist/sphinx_*.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sphinx-debian
          path: |
            debian/dist/sphinx_*.deb
            debian/dist/SHA256SUMS.txt
