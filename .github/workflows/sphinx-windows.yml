name: Sphinx — Windows edition

# The Windows edition's build gate: the pytest suite plus a real
# PyInstaller build on windows-latest. (The dev VM is Linux and
# cannot produce a Windows exe; this workflow is the build proof.)
on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/sphinx-windows.yml"
  pull_request:
    paths:
      - "windows/**"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Smoke the production DNS manager (read-only)
        # The unit suite drives a fake manager; this step executes
        # the real PowerShell-backed reads on a real Windows
        # machine, so a broken script or registry read fails the
        # build instead of a user's first run. Read-only: it never
        # sets anything. (Added by the Phase 1 audit.)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "from sphinx_win.dnsmgmt.windows_impl import WindowsDnsManager; m = WindowsDnsManager(); rows = m.active_adapters(); print('active adapters:', rows); [print('get_dns', r.interface_alias, r.family, '->', m.get_dns(r.interface_alias, r.family)) for r in rows]"

      - name: Build the one-file exe
        run: >-
          python -m PyInstaller packaging/Sphinx.spec --noconfirm
          --distpath dist --workpath build/pyi

      - name: Assemble the portable edition
        shell: pwsh
        run: |
          $portable = Join-Path (Get-Location) 'dist\SphinxPortable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item 'dist\Sphinx.exe' $portable
          New-Item -ItemType File -Force (Join-Path $portable 'portable.txt') | Out-Null
          Compress-Archive -Path $portable -DestinationPath 'dist\SphinxPortable.zip' -Force

      - name: Build the installer
        # Inno Setup ships on the GitHub Windows images; install it
        # if this image doesn't carry it. The .iss compiles the exe
        # from the PyInstaller step into dist\SphinxSetup.exe; its
        # uninstaller restores DNS (via Sphinx.exe --restore-dns)
        # before removing anything.
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          } else {
            $iscc = $iscc.Source
          }
          & $iscc 'packaging\Sphinx.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path 'dist\SphinxSetup.exe')) { throw "SphinxSetup.exe missing" }

      - name: Write checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @('dist\Sphinx.exe', 'dist\SphinxPortable.zip', 'dist\SphinxSetup.exe')) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content 'dist\SHA256SUMS.txt' -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sphinx-windows
          path: |
            windows/dist/Sphinx.exe
            windows/dist/SphinxPortable.zip
            windows/dist/SphinxSetup.exe
            windows/dist/SHA256SUMS.txt
