name: ONE-OFF — Android signing fail-closed proof (delete after use)

# Temporary proof workflow (2026-10-23): runs the Gradle
# signedRelease task with NO signing environment present. The
# expected and desired outcome is FAILURE with the build script's
# plain-language refusal — that failure is the proof that the
# signing path fails closed at the Gradle layer too, not only at
# the sphinx-android workflow's secret gate. This file is removed
# in the commit right after the proof run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Run signedRelease with no signing env (MUST refuse)
        run: ./gradlew signedRelease --console=plain
