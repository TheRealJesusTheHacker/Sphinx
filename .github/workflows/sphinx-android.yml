name: Sphinx — Android

# The Android edition's test gate + signed-release pipeline.
#
# Manual dispatch only. Two stages:
#   gate       — the unit-test suite through Gradle, plus an
#                UNSIGNED release build. That build is a compile
#                proof only: the step below proves the APK really
#                is unsigned, and it is never uploaded anywhere.
#   signed-apk — only when the dispatch input `build_signed` is
#                true. Needs the owner's keystore secrets:
#                  SPHINX_ANDROID_KEYSTORE_BASE64 (base64 of the .jks)
#                  SPHINX_ANDROID_KEYSTORE_PASSWORD
#                  SPHINX_ANDROID_KEY_ALIAS
#                  SPHINX_ANDROID_KEY_PASSWORD
#                The Gradle build reads the four SPHINX_ANDROID_*
#                signing variables from the environment; without
#                them its signedRelease task refuses — fail-closed
#                by design, no debug-key fallback anywhere. The
#                signed APK is verified with apksigner (and
#                rejected if it somehow carries the debug
#                certificate) and uploaded as a workflow artifact,
#                ready to attach to a Sphinx release. This
#                workflow never creates or edits a release itself.

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: "Also build the signed APK (needs the owner's keystore secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Run the Android unit tests (Gradle)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the release variant unsigned (compile proof only)
        run: ./gradlew assembleRelease --console=plain

      - name: Prove the compile-proof APK is unsigned
        run: |
          apk=$(ls app/build/outputs/apk/release/*-unsigned.apk)
          echo "Compile proof: $apk"
          if "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk" 2>/dev/null; then
            echo "::error::The unsigned compile proof unexpectedly verifies as signed — refusing to treat it as a proof."
            exit 1
          fi
          echo "Confirmed: apksigner does not verify it — unsigned, as a compile proof must be."

  signed-apk:
    needs: gate
    if: inputs.build_signed
    runs-on: ubuntu-latest
    env:
      SPHINX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPHINX_ANDROID_KEYSTORE_PASSWORD }}
      SPHINX_ANDROID_KEY_ALIAS: ${{ secrets.SPHINX_ANDROID_KEY_ALIAS }}
      SPHINX_ANDROID_KEY_PASSWORD: ${{ secrets.SPHINX_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Materialise the owner's keystore from secrets
        env:
          SPHINX_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPHINX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          for v in SPHINX_ANDROID_KEYSTORE_BASE64 SPHINX_ANDROID_KEYSTORE_PASSWORD SPHINX_ANDROID_KEY_ALIAS SPHINX_ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Signed build requested but these secrets are not set:$missing — the owner's keystore secrets are required; there is no fallback key."
            exit 1
          fi
          echo "$SPHINX_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sphinx-release.jks"
          echo "SPHINX_ANDROID_KEYSTORE=$RUNNER_TEMP/sphinx-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK (Gradle refuses without the signing env)
        run: ./gradlew signedRelease --console=plain

      - name: Verify the signature — and that it is not the debug certificate
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          echo "Signed APK: $apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then
            echo "::error::The APK carries the Android Debug certificate — refusing it."
            exit 1
          fi
          echo "SPHINX_SIGNED_APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sphinx-android-signed-apk
          path: ${{ env.SPHINX_SIGNED_APK }}
          if-no-files-found: error
