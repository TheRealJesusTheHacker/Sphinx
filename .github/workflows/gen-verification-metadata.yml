name: TEMP — Generate Gradle verification metadata

# TEMPORARY workflow for the --require-hashes fleet rollout
# (2026-10-25). It generates gradle/verification-metadata.xml from
# the actual dependency resolution of the current pins and uploads
# it as an artifact so it can be committed to the repo. This file
# is removed in the same change-set that commits the generated
# metadata; it is not a permanent gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate verification metadata from the real resolution
        run: ./gradlew --write-verification-metadata sha256 testDebugUnitTest assembleRelease --console=plain

      - name: Show what was generated
        run: |
          ls -l gradle/verification-metadata.xml
          grep -c "<component" gradle/verification-metadata.xml || true
          head -n 40 gradle/verification-metadata.xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
