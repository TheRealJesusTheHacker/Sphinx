name: Sphinx — Attach SHA256SUMS (one-off, v1.0.1)

# One-off recovery: the v1.0.1 release run's checksums job
# generated SHA256SUMS.txt but its attach step failed — the
# step named no --repo and the job has no checkout, so gh had
# no repo context (release.yml is fixed on main the same day;
# Argus's pattern carried --repo all along). This workflow
# does that one job for the v1.0.1 release, inside Actions,
# and is removed after use.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-sums:
    runs-on: ubuntu-latest
    steps:
      - name: Download the v1.0.1 assets and generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download v1.0.1 \
            --repo ${{ github.repository }} \
            --pattern "Sphinx.exe" --pattern "SphinxPortable.zip" \
            --pattern "SphinxSetup.exe" --pattern "sphinx_*.deb" \
            --dir release-assets
          cd release-assets
          sha256sum Sphinx.exe SphinxPortable.zip SphinxSetup.exe sphinx_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to the v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.1 release-assets/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
