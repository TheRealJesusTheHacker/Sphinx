name: Sphinx — Release

# Builds the release assets when a release is published and
# attaches them to that release (the fleet pattern, as in Argus):
# the two edition jobs mirror the edition build gates
# (sphinx-windows.yml / sphinx-debian.yml) step for step, then a
# final checksums job attaches ONE SHA256SUMS.txt covering all
# four assets — a sums file generated inside either edition job
# could never cover the other edition's asset, and two racing
# sums files would clobber each other.
#
# The editions carry their own versions (Windows
# sphinx_win.__version__ / the Inno AppVersion, Debian
# sphinx_deb.__version__); the release tag is the umbrella
# Sphinx version and intentionally matches neither.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions: { contents: write }
    defaults:
      run:
        working-directory: windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Smoke the production DNS manager (read-only)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "from sphinx_win.dnsmgmt.windows_impl import WindowsDnsManager; m = WindowsDnsManager(); rows = m.active_adapters(); print('active adapters:', rows); [print('get_dns', r.interface_alias, r.family, '->', m.get_dns(r.interface_alias, r.family)) for r in rows]"

      - name: Build the one-file exe
        run: >-
          python -m PyInstaller packaging/Sphinx.spec --noconfirm
          --distpath dist --workpath build/pyi

      - name: Assemble the portable edition
        shell: pwsh
        run: |
          $portable = Join-Path (Get-Location) 'dist\SphinxPortable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item 'dist\Sphinx.exe' $portable
          New-Item -ItemType File -Force (Join-Path $portable 'portable.txt') | Out-Null
          Compress-Archive -Path $portable -DestinationPath 'dist\SphinxPortable.zip' -Force

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          } else {
            $iscc = $iscc.Source
          }
          & $iscc 'packaging\Sphinx.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path 'dist\SphinxSetup.exe')) { throw "SphinxSetup.exe missing" }

      - name: Attach the Windows assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/Sphinx.exe dist/SphinxPortable.zip dist/SphinxSetup.exe --clobber

  debian:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults:
      run:
        working-directory: debian
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Shellcheck the maintainer scripts
        run: >-
          shellcheck -s sh packaging/postinst packaging/prerm
          packaging/postrm packaging/build-deb.sh packaging/sphinx

      - name: Build the .deb
        run: sh packaging/build-deb.sh dist

      - name: Verify the package payload
        run: |
          dpkg-deb -I dist/sphinx_*.deb
          dpkg-deb -c dist/sphinx_*.deb

      - name: Attach the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/sphinx_*.deb --clobber

  # One SHA256SUMS.txt for the whole release, generated only
  # after BOTH edition jobs have attached their assets.
  checksums:
    runs-on: ubuntu-latest
    needs: [windows, debian]
    permissions: { contents: write }
    steps:
      - name: Download the release assets and generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --pattern "Sphinx.exe" --pattern "SphinxPortable.zip" \
            --pattern "SphinxSetup.exe" --pattern "sphinx_*.deb" \
            --dir release-assets
          cd release-assets
          sha256sum Sphinx.exe SphinxPortable.zip SphinxSetup.exe sphinx_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} release-assets/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
